name: Announce merged case

# When a pull request that adds or changes a case merges, post it to the TLDP Discord (#case-studies)
# with the author's name. Secret: DISCORD_CASES_WEBHOOK (the channel's webhook URL).

on:
  pull_request:
    types: [closed]
    paths: ["cases/**"]

permissions:
  contents: read

jobs:
  announce:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_CASES_WEBHOOK }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          python - <<'EOF'
          import json, os, re, subprocess, urllib.request
          files = subprocess.run(["git", "diff", "--name-only", os.environ["BASE"], os.environ["HEAD"]], capture_output=True, text=True).stdout.split()
          folders = sorted({"/".join(f.split("/")[:3]) for f in files if f.startswith("cases/") and f.count("/") >= 3 and not f.startswith("cases/_template")})
          if not folders or not os.environ.get("WEBHOOK"):
              print("nothing to announce"); raise SystemExit(0)
          lines = []
          for folder in folders:
              readme = os.path.join(folder, "README.md")
              title = os.environ["PR_TITLE"]
              if os.path.exists(readme):
                  first = next((l for l in open(readme, encoding="utf-8") if l.startswith("# ")), "")
                  title = first[2:].strip() or title
              major = folder.split("/")[1].replace("-", " ").title()
              url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/tree/main/{folder}"
              lines.append(f"📁 **New case merged** — {major}\n**{title}** by @{os.environ['AUTHOR']}\n<{url}>")
          body = {"content": "\n\n".join(lines)[:2000], "allowed_mentions": {"parse": []}}
          urllib.request.urlopen(urllib.request.Request(os.environ["WEBHOOK"], data=json.dumps(body).encode(), headers={"Content-Type": "application/json", "User-Agent": "tldp-case-studies"}))
          print("announced:", folders)
          EOF
